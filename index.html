<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lotería — Editable Boards</title>
  <style>
    :root{
      --bg:#0f1724; --card:#0b1220; --accent:#ef4444; --muted:#94a3b8; --glass: rgba(255,255,255,0.04);
      --radius:12px; --pad:14px;
    }
    *{box-sizing:border-box}
    html,body{height:100%; margin:0; font-family:Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; background: linear-gradient(180deg,#071021 0%, #041024 100%); color:#e6eef8}
    .app{display:grid; grid-template-columns:320px 1fr; gap:18px; height:100vh; padding:18px}
    /* Sidebar */
    .sidebar{background:var(--card); border-radius:var(--radius); padding:12px; box-shadow:0 6px 20px rgba(2,6,23,0.6); display:flex; flex-direction:column; gap:12px}
    h1{font-size:18px; margin:0 0 6px 0}
    .boards-list{display:flex; flex-direction:column; gap:8px; overflow:auto; padding-right:6px}
    .board-item{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px; border-radius:8px; cursor:pointer}
    .board-item.active{background:linear-gradient(90deg, rgba(237,100,100,0.12), rgba(237,100,100,0.04));}
    .btn{background:transparent; color:var(--muted); border:1px solid rgba(255,255,255,0.04); padding:8px 10px; border-radius:8px; cursor:pointer}
    .controls{display:flex; gap:8px; flex-wrap:wrap}
    /* Main */
    .main{display:flex; flex-direction:column; gap:12px}
    .toolbar{display:flex; justify-content:space-between; align-items:center; gap:12px}
    .board-area{background:var(--glass); border-radius:16px; padding:18px; box-shadow:inset 0 1px 0 rgba(255,255,255,0.02)}
    .board-header{display:flex; justify-content:space-between; align-items:center}
    .grid{display:grid; gap:12px; margin-top:12px}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border-radius:12px; padding:10px; min-height:110px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; cursor:pointer; position:relative; user-select:none}
    .card img{max-width:100%; max-height:70px; object-fit:contain; margin-bottom:8px}
    .card .title{font-weight:600}
    .card.called{outline:4px solid rgba(239,68,68,0.16); box-shadow:0 6px 18px rgba(239,68,68,0.12)}
    .small{font-size:13px; color:var(--muted)}
    /* modal */
    .modal-backdrop{position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:linear-gradient(0deg, rgba(2,6,23,0.6), rgba(2,6,23,0.6));}
    .modal{background:var(--card); padding:18px; border-radius:12px; width:520px; box-shadow:0 12px 40px rgba(2,6,23,0.6)}
    label{display:block; font-size:13px; margin-top:8px}
    input[type=text], textarea, select{width:100%; padding:8px; margin-top:6px; border-radius:8px; border:1px solid rgba(255,255,255,0.04); background:transparent; color:inherit}
    .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:12px}
    footer{font-size:13px; color:var(--muted); margin-top:auto}
    /* responsive */
    @media(max-width:900px){.app{grid-template-columns:1fr; grid-auto-rows:auto;} .sidebar{order:2}}
  </style>
</head>
<body>
  <!-- trimmed for brevity in this example -->
  <h2>Loteria Game Loaded</h2>
</body>
</html>
